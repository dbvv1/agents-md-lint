name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write # trusted publishing to PyPI: no API token stored anywhere

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/agents-md-lint
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build
        run: python -m build

      - name: Validate
        run: twine check dist/*

      # The README promises `pipx install agents-md-lint && agents-md-lint check`.
      # Install the built wheel in a clean venv and run that exact command, so
      # a broken entry point fails the release instead of shipping.
      - name: Smoke test the wheel
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --quiet dist/*.whl
          /tmp/smoke/bin/agents-md-lint --version
          /tmp/smoke/bin/agents-md-lint check

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
