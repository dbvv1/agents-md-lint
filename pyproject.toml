[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agents-md-lint"
version = "0.1.0"
description = "Report when the files your agent trusts — CLAUDE.md, AGENTS.md — no longer match the repo."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Open Intelligence Labs contributors" }]
requires-python = ">=3.11"
keywords = ["claude", "agents-md", "claude-md", "ai-agents", "linting", "staleness", "context-engineering"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
# Zero runtime dependencies: this must be trivial to install and fast to run.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
agents-md-lint = "agents_md_lint.cli:main"

[project.urls]
Homepage = "https://github.com/openintelligence-labs/agents-md-lint"

[tool.hatch.build.targets.wheel]
packages = ["src/agents_md_lint"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
